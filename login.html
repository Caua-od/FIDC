<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso FIDC Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* paleta Franklin Templeton */
  --ft-blue2: #aabbfe;
  --ft-blue: #002e88;
  --ft-blues: #001f62;
  --ft-gray4: #293438;

  --bg: #080c10;
  --surface: #141b22;
  --border: #232e38;
  --text: #e8edf5;
  --text-dim: #93a2ba;
  --accent: var(--ft-blue2);
  --accent-glow: rgba(170, 187, 254, 0.14);
  --font-display: 'Space Grotesk', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-display);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 16px;
  position: relative;
}

.field {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.35;
  mask-image: radial-gradient(ellipse 60% 50% at 50% 45%, black, transparent 75%);
}

.glow {
  position: fixed;
  width: 600px;
  height: 600px;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  filter: blur(40px);
  animation: breathe 6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes breathe {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.08); }
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem 2rem;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
  opacity: 0;
  transform: translateY(16px);
  animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}

@keyframes rise {
  to { opacity: 1; transform: translateY(0); }
}

.mark {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1rem;
}

/* ===== LOGO =====
   Caminho relativo a este arquivo. Ajuste se mover os arquivos de pasta. */
.mark img {
  width: 300abpx;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

h1 {
  font-size: 22px;
  font-weight: 500;
  text-align: center;
  margin: 0 0 0.4rem;
  letter-spacing: -0.01em;
}

.sub {
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
  margin: 0 0 1.25rem;
}

form { display: flex; flex-direction: column; gap: 10px; min-width: 280px; }

input[type="password"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 15px;
  letter-spacing: 0.3em;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input[type="password"]::placeholder {
  letter-spacing: 0.3em;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

input[type="password"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

input[type="password"].error {
  border-color: #f0997b;
  animation: shake 0.4s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

button {
  margin-top: 6px;
  background: var(--ft-blue2);
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: #001433;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

button:hover { background: #c3cffe; }
button:active { transform: scale(0.98); }

.msg {
  min-height: 18px;
  text-align: center;
  font-size: 12px;
  color: #f0997b;
  margin-top: 10px;
}

.foot {
  margin-top: 1.25rem;
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

.success-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  z-index: 10;
}

.success-overlay.show { opacity: 1; pointer-events: auto; }

.ring {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .glow, .card, .ring { animation: none !important; }
  .card { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="field"></div>
<div class="glow"></div>

<div class="card">
  <div class="mark">
    <img src="Images/Franklin_logo_black.png" alt="Franklin Templeton">
  </div>
  <h1>Acesso restrito</h1>
  <p class="sub">Informe a senha para continuar</p>

  <form id="loginForm">
    <input type="password" id="pw" placeholder="••••••" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">protótipo interno — não produção</div>
</div>

<div class="success-overlay" id="overlay">
  <div class="ring"></div>
</div>

<script>
var SENHA = "abc";
var form = document.getElementById('loginForm');
var pw = document.getElementById('pw');
var msg = document.getElementById('msg');
var overlay = document.getElementById('overlay');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  var val = pw.value.trim();

  if (val === '') {
    msg.textContent = 'Digite a senha.';
    pw.classList.add('error');
    setTimeout(function(){ pw.classList.remove('error'); }, 400);
    return;
  }

  if (val !== SENHA) {
    msg.textContent = 'Senha incorreta.';
    pw.classList.add('error');
    pw.value = '';
    setTimeout(function(){ pw.classList.remove('error'); }, 400);
    return;
  }

  msg.textContent = '';
  overlay.classList.add('show');

  setTimeout(function() {
    window.location.href = 'dashboard.html';
  }, 800);
});
</script>

</body>
</html>
